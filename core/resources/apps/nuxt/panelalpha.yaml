# yaml-language-server: $schema=../../platforms/_schema.json
id: nuxt
label: Nuxt
priority: 915
runtime: node
port: 3000
output_directory: .output
env:
  NITRO_HOST: 0.0.0.0
  NITRO_PORT: '3000'
requires:
  node: runtime
detect:
  any:
    - glob: nuxt.config
    - dep: nuxt
commands:
  - id: npm-install
    stage: build
    role: dependencies
    run: '{{js.install}}'
    description: "Resolved from the project's lockfile — npm ci, pnpm install --frozen-lockfile, yarn or bun."
  - id: nuxt-build
    stage: build
    run: '{{js.build:npx nuxt build}}'
    description: "The project's own build script wins over this default when package.json defines one."
  - id: serve
    stage: start
    serve: true
    run: '{{js.start:node panelalpha.serve.mjs}}'
    description: 'panelalpha.serve.mjs is the Nitro entry shim the engine writes into the project; StandaloneNodeServe::FILENAME is the source of that name.'
