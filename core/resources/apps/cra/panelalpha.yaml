# yaml-language-server: $schema=../../platforms/_schema.json
id: cra
label: 'Create React App'
priority: 892
runtime: nginx
port: 8080
output_directory: build
requires:
  node:
    role: build
detect:
  dep: react-scripts
commands:
  - id: npm-install
    stage: build
    role: dependencies
    run: '{{js.install}}'
    description: "Resolved from the project's lockfile — npm ci, pnpm install --frozen-lockfile, yarn or bun."
  - id: cra-build
    stage: build
    run: '{{js.build:npx react-scripts build}}'
    description: "The project's own build script wins over this default when package.json defines one."
