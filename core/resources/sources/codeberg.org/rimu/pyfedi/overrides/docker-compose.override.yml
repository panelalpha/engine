# Layers over the compose file the dockerfile strategy generates. The engine's
# runtime-sidecars reader merges the repository's db and redis into it, but the
# db as written is undeployable inside an account: its credentials come from
# .env.docker (which does not exist in a fresh checkout, so the placeholders the
# engine writes are what both sides would read), its command asks for
# shared_buffers=1GB / work_mem=32MB / max_wal_size=3GB — sized for a dedicated
# host, fatal inside a 1GB account — and the generated app env spells the
# connection postgres://, which SQLAlchemy 2.x rejects. This layer replaces both
# services with right-sized ones that interpolate their credentials from the
# .env the prepare hook wrote, so the app (env_file: .env) and the database
# (this file) are configured from one text. The app service only adds what the
# generated file cannot say: wait for a healthy postgres before booting, so
# `flask db upgrade` in the entrypoint does not race the database start.
services:
  app:
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    user: "999:999"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-piefed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-piefed}
      PGDATA: /var/lib/postgresql/data/pgdata
    shm_size: 128mb
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=256MB
      - -c
      - max_connections=60
      - -c
      - jit=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-piefed} -d ${POSTGRES_DB:-piefed}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 512m

  redis:
    image: redis:6.2
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data
    mem_limit: 192m

volumes:
  postgres-data:
  redis-data: null