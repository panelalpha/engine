server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # A dotfile in a build output is never a page, and the SPA rewrite would
    # otherwise answer /.env with index.html rather than a refusal. ACME
    # stays reachable: a prefix match beats the regex.
    location ^~ /.well-known/ {
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }


}
