# yaml-language-server: $schema=../_schema.json
#
# The rule the port probe has always applied, said out loud. A 5xx is the one
# response that is unambiguously the application's own fault: it accepted the
# connection, so it is running, and then failed to answer -- which is why 4xx
# deliberately stays healthy here. Plenty of applications legitimately 404 on
# `/`, and an API that answers 401 to an unauthenticated probe is working.
id: no-server-error
severity: error
serving: error_page
expect:
  status_not: ['5xx']
message: 'The application is running but failing: it answered {status}.'
fix: 'Read the application log — the container is up, so this is the code inside it.'
