# ------------------------------------------------------------------------
# PanelAlpha — WordPress / WooCommerce exclusions for OWASP CRS 4.x
# Loaded before CRS rule files (898 < 900). Safe to ship on update: cp -Rn
# does not overwrite an existing file on the instance.
# ------------------------------------------------------------------------

# WooCommerce checkout AJAX — false positive 933150 (session_start in post_data)
SecRule ARGS:wc-ajax "@streq update_order_review" \
    "id:1000050,phase:1,pass,nolog,\
    ctl:ruleRemoveById=933150;ARGS:post_data,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:post_data,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:post_data,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:post_data"

SecRule ARGS:wc-ajax "@streq checkout" \
    "id:1000051,phase:1,pass,nolog,\
    ctl:ruleRemoveById=933150;ARGS:post_data,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:post_data"

# WordPress / WooCommerce session cookies — false positive 942100 (libinjection)
SecRule REQUEST_HEADERS:Cookie "@rx (?i)(wordpress_|wp_woocommerce|woocommerce_)" \
    "id:1000060,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetByTag=attack-sqli;REQUEST_COOKIES"
